[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reactrisk"
version = "0.1.0"
description = "Reaction-diffusion risk zones: glioma recurrence from MRI, financial contagion on networks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
finance = ["networkx"]
dev = ["pytest", "networkx"]

[tool.setuptools.packages.find]
include = ["reactrisk*"]
